services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pumpwatch
      POSTGRES_PASSWORD: pumpwatch
      POSTGRES_DB: pumpwatch
    ports:
      - "5432:5432"
    volumes:
      - pumpwatch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumpwatch -d pumpwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pumpwatch_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      # Override the localhost-style URLs from .env with compose service names.
      DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@postgres:5432/pumpwatch
      REDIS_URL: redis://redis:6379/0
    command: python -m pumpwatch.bot.main
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Single-instance by design: Beat must not run multiple replicas, otherwise
  # fetch_batch fires twice per tick. Compose does not enforce this without
  # Swarm; document and respect.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@postgres:5432/pumpwatch
      REDIS_URL: redis://redis:6379/0
    # /tmp is writable by the non-root pumpwatch user; default ./celerybeat-schedule
    # path is not. Schedule is rebuilt from celery_app.py on each restart, so
    # losing it is fine for our shape.
    command: celery -A pumpwatch.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Horizontally scalable Celery worker pool. PROMETHEUS_MULTIPROC_DIR
  # must be set BEFORE Python boots so prometheus_client picks up
  # multiproc mode at Counter-construction time — that's why it's an
  # env override here rather than a runtime call.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@postgres:5432/pumpwatch
      REDIS_URL: redis://redis:6379/0
      PROMETHEUS_MULTIPROC_DIR: /tmp/pumpwatch-metrics
    command: >
      celery -A pumpwatch.celery_app worker
      --loglevel=INFO -Q default,high,medium,low --concurrency=4
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Single-instance long-running consumer of pw:price.updated. Pub-sub has
  # zero replay, so during a restart events are lost for the restart
  # window — Postgres snapshot rows remain authoritative.
  alerts:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@postgres:5432/pumpwatch
      REDIS_URL: redis://redis:6379/0
    command: python -m pumpwatch.alerts.main
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Optional observability stack. Bring up with:
  #   docker compose --profile observability up
  # Default `docker compose up` does NOT start these services.
  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pumpwatch_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pumpwatch_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pumpwatch_pg_data:
  pumpwatch_redis_data:
  pumpwatch_prometheus_data:
  pumpwatch_grafana_data:
