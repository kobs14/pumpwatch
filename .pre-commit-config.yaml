repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--strict, src]
        additional_dependencies:
          - pydantic>=2.6
          - pydantic-settings>=2.2
          - sqlalchemy[asyncio]>=2.0
          - structlog>=24.1
        pass_filenames: false
