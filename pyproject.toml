[project]
name = "pumpwatch"
version = "0.1.0"
description = "Multi-user Telegram bot for monitoring Solana memecoins via Pump.fun"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "aiohttp>=3.9",
    "tenacity>=8.2",
    "aiolimiter>=1.1",
    "python-dateutil>=2.9",
    "python-telegram-bot[job-queue]>=21",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis",
    "aioresponses>=0.7",
    "types-python-dateutil",
]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.ruff.format]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pumpwatch"]
