services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pumpwatch
      POSTGRES_PASSWORD: pumpwatch
      POSTGRES_DB: pumpwatch
    ports:
      - "5432:5432"
    volumes:
      - pumpwatch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumpwatch -d pumpwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pumpwatch_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: python -m pumpwatch.main
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import pumpwatch; print(pumpwatch.__version__)"]
      interval: 10s
      timeout: 5s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      # Override the localhost-style URLs from .env with compose service names.
      DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@postgres:5432/pumpwatch
      REDIS_URL: redis://redis:6379/0
    command: python -m pumpwatch.bot.main
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Single-instance by design: Beat must not run multiple replicas, otherwise
  # fetch_batch fires twice per tick. Compose does not enforce this without
  # Swarm; document and respect.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@postgres:5432/pumpwatch
      REDIS_URL: redis://redis:6379/0
    command: celery -A pumpwatch.celery_app beat --loglevel=INFO
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Horizontally scalable: Session 7 will manage replica counts and
  # per-tier worker pools.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@postgres:5432/pumpwatch
      REDIS_URL: redis://redis:6379/0
    command: >
      celery -A pumpwatch.celery_app worker
      --loglevel=INFO -Q default,high,medium,low --concurrency=4
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # Single-instance long-running consumer of pw:price.updated. Pub-sub has
  # zero replay, so during a restart events are lost for the restart
  # window — Postgres snapshot rows remain authoritative.
  alerts:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@postgres:5432/pumpwatch
      REDIS_URL: redis://redis:6379/0
    command: python -m pumpwatch.alerts.main
    volumes:
      - ./src:/app/src
    restart: unless-stopped

volumes:
  pumpwatch_pg_data:
  pumpwatch_redis_data:
